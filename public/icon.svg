<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1130" />
      <stop offset="100%" stop-color="#0a0614" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#3b2762" stroke-width="12" />
  
  <!-- Subtle glowing circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#purple)" stroke-width="6" opacity="0.4" />
  
  <!-- KORG Bold Stylized Letter K -->
  <path d="M140 120 L195 120 L195 392 L140 392 Z" fill="url(#gold)" />
  <path d="M360 120 L270 240 L372 392 L305 392 L225 275 L195 315 L195 255 L252 178 L310 120 Z" fill="url(#gold)" />
  
  <!-- Oriental Quarter Tone Badge ¼ -->
  <rect x="290" y="320" width="105" height="48" rx="14" fill="#a855f7" />
  <text x="342" y="354" font-family="monospace, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">¼ TUN</text>

  <!-- Piano Key accents at bottom -->
  <g transform="translate(140, 420)" opacity="0.8">
    <rect x="0" y="0" width="30" height="40" rx="4" fill="#ffffff" />
    <rect x="34" y="0" width="30" height="40" rx="4" fill="#fbbf24" />
    <rect x="68" y="0" width="30" height="40" rx="4" fill="#ffffff" />
    <rect x="102" y="0" width="30" height="40" rx="4" fill="#ffffff" />
    <rect x="136" y="0" width="30" height="40" rx="4" fill="#fbbf24" />
    <rect x="170" y="0" width="30" height="40" rx="4" fill="#ffffff" />
    <rect x="204" y="0" width="30" height="40" rx="4" fill="#ffffff" />
  </g>
</svg>
