name: Build Android APK and Live Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web, Deploy Live Update & Build APK
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Configure Android, Custom Icon and Mic permissions
        run: |
          npx cap add android || true
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
            npx capacitor-assets generate --android || true
          fi
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          PKG_LINE=$(grep "^package " "$MAIN_ACT")
          cat <<EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korg-Oriental-Commander-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
