name: Build iOS IPA (Standalone)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/ios https://github.com --legacy-peer-deps
          npm run build

      - name: Add iOS platform and sync
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build Unsigned iOS App & Package IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build SYMROOT=build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r ../../Korg-Yamaha-Pro-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korg-Yamaha-Pro-iOS-ipa
          path: Korg-Yamaha-Pro-iOS.ipa
